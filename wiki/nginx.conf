# 前端容器内部的 nginx：只负责托管静态文件 + SPA 路由回退。
# /api 和 /wiki(图片) 由宿主机 nginx 反代，不会进到这里。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的构建产物（文件名含 hash，内容变即换名）可长期不可变缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @stale_asset;
    }

    # 部署清理旧 chunk 后，仍缓存着旧 index.html 的浏览器会请求已不存在的 /assets 文件
    # （表现为不清缓存就白屏/旧版，无痕正常）。这类客户端跑的还是旧 JS，新代码无法触达，
    # 唯一能触达它们的是服务器：对缺失的 /assets 资源不再 404，而是返回一段自愈脚本——
    # 绕过 HTTP 缓存强制重取 index.html 再整页刷新。sessionStorage 防循环，成功启动后由 main.js 清除。
    location @stale_asset {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 "try{if(!sessionStorage.getItem('stale-heal')){sessionStorage.setItem('stale-heal','1');fetch('/index.html',{cache:'reload'}).catch(function(){}).then(function(){location.reload();});}}catch(e){location.reload();}";
    }

    # index.html 绝不可长期缓存：每次使用前都必须向服务器校验（ETag → 304 或拿到新版）。
    # 否则浏览器会按 Last-Modified 做启发式缓存，部署后仍用旧 index.html → 引用已被清理的旧 chunk
    # → 白屏 / 看到旧版本。SPA 回退到 /index.html 的内部重定向会再次匹配本规则，故所有 history 路由同样不缓存。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Vue history 路由：找不到实体文件就回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
