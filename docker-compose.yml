# SurviveXMUM 前端部署。后端在 SurviveXMUM-server 仓库里独立部署，两边互不依赖：
# 前端只监听 127.0.0.1:8081，后端只监听 :8080，由宿主机 nginx 分别反代 / 和 /api/。
services:
  frontend:
    build:
      context: ./wiki
    image: survivexmum-frontend:latest
    container_name: wiki-frontend
    # 只监听本机回环，由宿主机 nginx 反代到这里（location / → 前端）。
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
